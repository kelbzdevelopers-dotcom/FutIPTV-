
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080d">
  <meta name="description" content="FutIPTV - Seu centro de entretenimento.">
  <title>FutIPTV</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">⚽</span>
      <span>Fut<span>IPTV</span></span>
    </div>

    <button id="refreshBtn" type="button" aria-label="Atualizar canais">
      ↻
    </button>
  </header>

  <main>
    <section class="playlist-import">
      <h2>📡 Minhas playlists</h2>
      <p>Importe sua playlist M3U por URL.</p>

      <div class="import-controls">
        <input
          id="playlistUrl"
          type="url"
          placeholder="https://exemplo.com/playlist.m3u"
          autocomplete="url"
        >

        <button id="importPlaylistBtn" type="button">
          Importar
        </button>
      </div>

      <p id="importStatus" role="status" aria-live="polite"></p>
    </section>

    <section class="search-area">
      <input
        id="searchInput"
        type="search"
        placeholder="Pesquisar canais..."
        autocomplete="off"
      >
    </section>

    <nav id="categories" class="categories" aria-label="Categorias">
      <button class="category active" type="button" data-category="Todos">
        Todos
      </button>
    </nav>

    <section id="playerSection" class="player-section" hidden>
      <div id="playerContainer" class="player-container">
        <video
          id="videoPlayer"
          controls
          playsinline
          preload="metadata"
        ></video>
      </div>

      <div class="player-info">
        <h2 id="playerTitle">Reproduzindo</h2>

        <button id="fullscreenBtn" type="button">
          ⛶ Tela cheia
        </button>

        <button id="closePlayer" type="button">
          Fechar
        </button>
      </div>
    </section>

    <section class="channels-section">
      <div class="section-heading">
        <h2>Canais</h2>
        <span id="channelCount">0 canais</span>
      </div>

      <p id="status" role="status" aria-live="polite"></p>

      <div id="loading" hidden>
        Carregando canais...
      </div>

      <div id="canais" class="channels-grid"></div>

      <div id="emptyState" hidden>
        <h3>Nenhum canal encontrado</h3>
        <p>Importe uma playlist ou tente outra pesquisa.</p>
      </div>
    </section>
  </main>

  <footer>
    <p>FutIPTV · 1.2.0</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
